<head>

<title>BUCCARI BC-05 Care</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+Arabic:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
/* Layout: one narrow phone column, like the box's side panel — logo, then three hairline-separated sections */
:root{
  --paper:#F4F2EF; --card:#FBFAF8; --ink:#141414; --muted:#6B6862; --rule:#D8D3CA; --line:#8E8981; --accent:#8A6A4A;
  --f-display:'Jost','Noto Sans SC','Noto Sans Arabic',system-ui,sans-serif;
  --f-body:'Jost','Noto Sans SC','Noto Sans Arabic',system-ui,sans-serif;
  --logo-filter:none;
}
:root[data-mode="dark"]{--paper:#161514; --card:#1E1D1B; --ink:#EEEAE4; --muted:#A39E96; --rule:#34312D; --line:#6E6961; --accent:#C9A27C; --logo-filter:invert(1); color-scheme:dark}
html[lang="ar"]{--f-display:'Noto Sans Arabic','Jost',system-ui,sans-serif; --f-body:'Noto Sans Arabic','Jost',system-ui,sans-serif}
html[lang="zh"]{--f-display:'Jost','Noto Sans SC',system-ui,sans-serif; --f-body:'Noto Sans SC','Jost',system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; padding-inline:20px; padding-block:28px 40px}
.wrap{max-width:440px; margin:0 auto; display:flex; flex-direction:column; gap:28px}
.langs{display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap}
.langs button{font:inherit; font-size:13px; letter-spacing:1px; padding:8px 12px; min-height:40px; background:transparent; color:var(--muted); border:1px solid transparent; border-radius:2px; cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--ink); border-color:var(--line)}
.langs button:focus-visible,a:focus-visible,.copy:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
header{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding-block:12px 4px}
header img{width:210px; height:auto; filter:var(--logo-filter)}
.model{display:flex; align-items:center; gap:16px; font-family:'Jost',sans-serif; font-weight:500; font-size:13px; letter-spacing:6px; color:var(--ink)}
.model::before,.model::after{content:""; width:36px; height:1px; background:var(--line)}
h1{font-family:var(--f-display); font-weight:300; font-size:26px; line-height:1.2; margin:6px 0 0; text-wrap:balance}
.sub{color:var(--muted); font-size:15px; margin:0}
section{display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--rule); padding-top:22px}
h2{font-family:var(--f-display); font-weight:500; font-size:13px; letter-spacing:3px; text-transform:uppercase; margin:0}
html[lang="ar"] h2,html[lang="zh"] h2{letter-spacing:1px}
.note{color:var(--muted); font-size:14px; margin:0}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.row{display:flex; flex-direction:column; gap:8px}
a.btn{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:52px; padding:12px 16px; background:var(--card); color:var(--ink); text-decoration:none; border:1px solid var(--rule); border-radius:2px; transition:border-color .15s}
a.btn:hover{border-color:var(--line)}
a.btn .t{display:flex; align-items:center; gap:12px; min-width:0}
a.btn svg{flex-shrink:0}
a.btn .arrow{color:var(--muted)}
html[dir="rtl"] a.btn .arrow{transform:scaleX(-1)}
a.btn.pending{pointer-events:none; opacity:.55}
a.btn small{display:block; color:var(--muted); font-size:12px}
.contact{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; background:var(--card); border:1px solid var(--rule); border-radius:2px}
.contact .v{user-select:all; font-variant-numeric:tabular-nums; min-width:0; overflow-wrap:anywhere}
.contact .k{color:var(--muted); font-size:12px}
.copy{font:inherit; font-size:13px; padding:8px 12px; min-height:40px; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:2px; cursor:pointer; flex-shrink:0}
footer{text-align:center; color:var(--muted); font-size:12px; letter-spacing:1px; padding-top:8px}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mode{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; background:transparent; color:var(--ink); border:1px solid var(--rule); border-radius:50%; cursor:pointer; flex-shrink:0}
.mode:hover{border-color:var(--line)}
.mode .sun{display:none}
:root[data-mode="dark"] .mode .sun{display:block}
:root[data-mode="dark"] .mode .moon{display:none}
</style>
<script>
/* Theme by the visitor's local time: light 07:00-18:59, dark otherwise. A manual switch lasts for the visit. */
(function(){
  var DAY_START=7, NIGHT_START=19;
  function auto(){var h=new Date().getHours(); return (h>=DAY_START && h<NIGHT_START)?'light':'dark';}
  function manual(){try{return sessionStorage.getItem('buccari-mode');}catch(e){return null;}}
  window.__autoMode=auto;
  window.__setMode=function(m){document.documentElement.setAttribute('data-mode',m); if(window.__onMode) window.__onMode(m);};
  window.__setMode(manual()||auto());
  setInterval(function(){ if(!manual()) window.__setMode(auto()); },5*60*1000);
})();
</script>

  if(CONFIG.phone) c.appendChild(contact(t.phone, CONFIG.phone, t));
  if(CONFIG.email) c.appendChild(contact(t.email, CONFIG.email, t));

  var s=document.getElementById('socials'); s.innerHTML='';
  s.appendChild(btn(CONFIG.instagram, ICON.ig, 'Instagram', t));
  s.appendChild(btn(CONFIG.facebook, ICON.fb, 'Facebook', t));
  s.appendChild(btn(CONFIG.x, ICON.x, 'X', t));

  var site=document.getElementById('site'); if(CONFIG.website){site.href=CONFIG.website; site.textContent=CONFIG.websiteLabel||CONFIG.website; site.hidden=false;} else {site.hidden=true;}
}

/* Language: own choice → country (Cloudflare) → device time zone. CIS → ru, Arab countries → ar, China/HK/Macau/Taiwan → zh, others → en. */
var CC_LANG = {
  ru:['RU','BY','KZ','KG','UZ','TJ','TM','AM','AZ','MD'],
  ar:['AE','SA','QA','KW','BH','OM','YE','IQ','JO','LB','SY','PS','EG','LY','TN','DZ','MA','SD','MR','SO','DJ','KM'],
  zh:['CN','HK','MO','TW']
};
var TZ_LANG = {
  ru:/^(Europe\/(Moscow|Minsk|Kaliningrad|Samara|Volgograd|Saratov|Ulyanovsk|Astrakhan|Kirov|Chisinau)|Asia\/(Yekaterinburg|Omsk|Novosibirsk|Barnaul|Tomsk|Novokuznetsk|Krasnoyarsk|Irkutsk|Chita|Yakutsk|Khandyga|Vladivostok|Ust-Nera|Magadan|Sakhalin|Srednekolymsk|Kamchatka|Anadyr|Almaty|Qostanay|Qyzylorda|Aqtobe|Aqtau|Atyrau|Oral|Tashkent|Samarkand|Bishkek|Dushanbe|Ashgabat|Yerevan|Baku))$/,
  ar:/^(Asia\/(Dubai|Riyadh|Qatar|Kuwait|Bahrain|Muscat|Aden|Baghdad|Amman|Beirut|Damascus|Gaza|Hebron)|Africa\/(Cairo|Tripoli|Tunis|Algiers|Casablanca|El_Aaiun|Khartoum|Nouakchott|Mogadishu|Djibouti)|Indian\/Comoro)$/,
  zh:/^(Asia\/(Shanghai|Urumqi|Hong_Kong|Macau|Taipei|Chongqing|Chungking|Harbin)|PRC|ROC)$/
};
function langFromCC(cc){ for(var l in CC_LANG) if(CC_LANG[l].indexOf(cc)>-1) return l; return 'en'; }
function langFromTZ(){ var tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){} for(var l in TZ_LANG) if(TZ_LANG[l].test(tz)) return l; return 'en'; }
function userLang(){ try{ var v=localStorage.getItem('buccari-lang-choice'); return T[v]?v:null; }catch(e){ return null; } }
var LANG='en';
document.querySelectorAll('.langs button').forEach(function(b){ b.addEventListener('click',function(){ try{ localStorage.setItem('buccari-lang-choice', b.dataset.lang); }catch(e){} LANG=b.dataset.lang; render(b.dataset.lang); }); });

var start=userLang(), cached=null;
try{ cached=sessionStorage.getItem('buccari-cc'); }catch(e){}
if(!start) start = cached ? langFromCC(cached) : langFromTZ();
LANG=start; render(start);
if(!userLang() && !cached && /^https?:/.test(location.protocol)){
  var ctl = window.AbortController ? new AbortController() : null;
  if(ctl) setTimeout(function(){ ctl.abort(); }, 2500);
  fetch('/cdn-cgi/trace', {cache:'no-store', signal: ctl?ctl.signal:undefined})
    .then(function(r){ return r.ok ? r.text() : ''; })
    .then(function(txt){ var m=/(?:^|\n)loc=([A-Z]{2})/.exec(txt); if(!m) return;
      try{ sessionStorage.setItem('buccari-cc', m[1]); }catch(e){}
      var l=langFromCC(m[1]); if(!userLang() && l!==LANG){ LANG=l; render(l); if(window.__onMode) window.__onMode(); } })
    .catch(function(){});
}

(function(){
  var mb=document.getElementById('modeBtn'); if(!mb) return;
  var L={"en": ["Dark mode", "Light mode"], "ru": ["Тёмная тема", "Светлая тема"], "ar": ["الوضع الداكن", "الوضع الفاتح"], "zh": ["深色模式", "浅色模式"]};
  function upd(){var lang=document.documentElement.lang||'en'; var l=L[lang]||L.en; var dark=document.documentElement.getAttribute('data-mode')==='dark'; mb.setAttribute('aria-label', dark?l[1]:l[0]); mb.title=mb.getAttribute('aria-label');}
  window.__onMode=upd;
  mb.addEventListener('click',function(){ var n=document.documentElement.getAttribute('data-mode')==='dark'?'light':'dark'; try{sessionStorage.setItem('buccari-mode',n);}catch(e){} window.__setMode(n); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.addEventListener('click',upd); });
  upd();
})();
</script>
